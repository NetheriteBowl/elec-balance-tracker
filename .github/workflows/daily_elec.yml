name: 每日电费自动查询与图表部署

on:
  schedule:
    - cron: '30 22 * * *'   # UTC 22:30 → 北京时间次日 6:30
  workflow_dispatch:         # 手动触发

permissions:
  contents: write            # 允许推送代码（如需提交CSV）
  pages: write               # 允许部署到 Pages
  id-token: write            # 用于 Pages 部署认证

jobs:
  fetch_and_deploy:
    # 使用 Playwright 官方 Python 容器（内含 Python 3.10 + Playwright + 浏览器）
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    container:
      image: mcr.microsoft.com/playwright/python:v1.48.0-noble
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 容器自带 Python 3.10，无需 setup-python，只需安装 pip 依赖
      - name: 安装 Python 依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行主脚本（获取电费数据）
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          ELEC_ACCOUNT: ${{ secrets.ELEC_ACCOUNT }}
          ELEC_ROOM_ID: ${{ secrets.ELEC_ROOM_ID }}
          ELEC_ROOM_NAME: ${{ secrets.ELEC_ROOM_NAME }}
          ELEC_FLOOR: ${{ secrets.ELEC_FLOOR }}
          ELEC_AREA: ${{ secrets.ELEC_AREA }}
          ELEC_BUILDING: ${{ secrets.ELEC_BUILDING }}
          ELEC_AID: ${{ secrets.ELEC_AID }}
          VPN_BASE: ${{ secrets.VPN_BASE }}
          ELEC_HOST: ${{ secrets.ELEC_HOST }}
          SSO_HOST: ${{ secrets.SSO_HOST }}
          SSO_PORT: 7280
          CAS_HOST: ${{ secrets.CAS_HOST }}
          CAS_PORT: 8080
          ELEC_PORT: 80
          VPN_COOKIE_NAME: ${{ secrets.VPN_COOKIE_NAME }}
        run: python main.py

      - name: 生成图表
        run: python plot.py

      - name: 提交 CSV 到仓库
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/*.csv
          git commit -m "chore: 自动更新电费数据 [skip ci]" || echo "无变更需要提交"
          git push
          
      - name: 上传静态文件到 Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/   # plot.py 生成的 HTML 存放目录

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
